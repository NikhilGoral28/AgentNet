[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devagentnet"
version = "0.1.0"
description = "Reusable AI Agents and Workflow Framework for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "devagentnet Contributors" },
]
keywords = ["ai", "agents", "llm", "workflows", "orchestration", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
all = [
    "openai>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/agentnet-ai/agentnet"
Documentation = "https://github.com/agentnet-ai/agentnet#readme"
Repository = "https://github.com/agentnet-ai/agentnet"

[tool.hatch.build.targets.wheel]
packages = ["src/agentnet"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
